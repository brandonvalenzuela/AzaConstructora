# Pipeline de CI/CD - AZA Constructora
# Automatiza el despliegue del sitio web

name: Deploy AZA Constructora Website

on:
  push:
    branches: [ development ]
  pull_request:
    branches: [ development ]
  workflow_dispatch: # Permite ejecutar manualmente

# Permisos necesarios para GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
      
    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: 📦 Instalar dependencias
      run: npm ci
      
    - name: 🔧 Crear archivo .env desde secrets
      run: |
        echo "FRONTEND_URL=${{ secrets.FRONTEND_URL }}" >> .env
        echo "EMAILJS_SERVICE_ID=${{ secrets.EMAILJS_SERVICE_ID }}" >> .env
        echo "EMAILJS_TEMPLATE_ID=${{ secrets.EMAILJS_TEMPLATE_ID }}" >> .env
        echo "EMAILJS_PUBLIC_KEY=${{ secrets.EMAILJS_PUBLIC_KEY }}" >> .env
        echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
        echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
        
    - name: ⚙️ Generar configuración (EmailJS + Supabase)
      run: npm run config
      
    - name: 🔍 Verificar archivos generados
      run: |
        echo "📁 Contenido de js/:"
        ls -la js/
        echo "📄 Contenido de js/config.js:"
        cat js/config.js | head -20  # Mostrar solo las primeras 20 líneas por seguridad
        echo "\n📁 Contenido de supabase/:"
        ls -la supabase/
        echo "📄 Contenido de supabase/config.js:"
        cat supabase/config.js | head -20  # Mostrar solo las primeras 20 líneas por seguridad
        echo "\n✅ Archivos críticos:"
        ls -la *.html css/ assets/ || true
        
    - name: 🧪 Ejecutar tests
      run: npm test --if-present
      continue-on-error: true # No fallar si no hay tests
      
    - name: 🔗 Crear enlaces para GitHub Pages
      run: |
        echo "🔗 Creando enlaces de páginas para GitHub Pages..."
        cp pages/contacto.html contacto.html
        cp pages/nosotros.html nosotros.html
        cp pages/proyectos.html proyectos.html
        cp pages/soluciones.html soluciones.html
        cp pages/sostenibilidad.html sostenibilidad.html
        echo "✅ Enlaces creados exitosamente"
        
    - name: 🔧 Ajustar rutas en páginas copiadas
      run: |
        echo "🔧 Ajustando rutas relativas en páginas copiadas..."
        # Ajustar rutas de CSS y JS en las páginas copiadas
        sed -i 's|href="css/|href="css/|g' *.html
        sed -i 's|src="js/|src="js/|g' *.html
        sed -i 's|href="assets/|href="assets/|g' *.html
        sed -i 's|src="assets/|src="assets/|g' *.html
        # Ajustar rutas de favicon (de ../assets/ a assets/)
        sed -i 's|href="../assets/images/aza-constructora.png"|href="assets/images/aza-constructora.png"|g' *.html
        # Ajustar rutas de imágenes en header y footer para GitHub Pages
        sed -i 's|src="../assets/images/aza-constructora.png"|src="assets/images/aza-constructora.png"|g' components/header.html
        sed -i 's|src="../assets/images/aza-constructora.png"|src="assets/images/aza-constructora.png"|g' components/footer.html
        # Ajustar rutas de componentes
        sed -i 's|components/header.html|components/header.html|g' *.html
        sed -i 's|components/footer.html|components/footer.html|g' *.html
        echo "✅ Rutas ajustadas correctamente"
      
    - name: ✅ Validar estructura del proyecto
      run: |
        echo "🔍 Validando archivos críticos..."
        echo "📁 Archivos principales:"
        test -f index.html && echo "✅ index.html" || echo "❌ index.html"
        test -f contacto.html && echo "✅ contacto.html (copia)" || echo "❌ contacto.html"
        test -f nosotros.html && echo "✅ nosotros.html (copia)" || echo "❌ nosotros.html"
        test -f proyectos.html && echo "✅ proyectos.html (copia)" || echo "❌ proyectos.html"
        test -f soluciones.html && echo "✅ soluciones.html (copia)" || echo "❌ soluciones.html"
        test -f sostenibilidad.html && echo "✅ sostenibilidad.html (copia)" || echo "❌ sostenibilidad.html"
        echo "📁 Páginas originales:"
        test -f pages/contacto.html && echo "✅ pages/contacto.html" || echo "❌ pages/contacto.html"
        test -f pages/nosotros.html && echo "✅ pages/nosotros.html" || echo "❌ pages/nosotros.html"
        test -f pages/proyectos.html && echo "✅ pages/proyectos.html" || echo "❌ pages/proyectos.html"
        test -f pages/soluciones.html && echo "✅ pages/soluciones.html" || echo "❌ pages/soluciones.html"
        test -f pages/sostenibilidad.html && echo "✅ pages/sostenibilidad.html" || echo "❌ pages/sostenibilidad.html"
        echo "📁 Recursos y componentes:"
        test -f js/config.js && echo "✅ js/config.js" || echo "❌ js/config.js"
        test -f supabase/config.js && echo "✅ supabase/config.js" || echo "❌ supabase/config.js"
        test -f js/contact-handler.js && echo "✅ js/contact-handler.js" || echo "❌ js/contact-handler.js"
        test -f js/supabase-client.js && echo "✅ js/supabase-client.js" || echo "❌ js/supabase-client.js"
        test -f js/site-config.js && echo "✅ js/site-config.js" || echo "❌ js/site-config.js"
        test -f js/validation-handler.js && echo "✅ js/validation-handler.js" || echo "❌ js/validation-handler.js"
        test -f css/styles.css && echo "✅ css/styles.css" || echo "❌ css/styles.css"
        test -f components/header.html && echo "✅ components/header.html" || echo "❌ components/header.html"
        test -f components/footer.html && echo "✅ components/footer.html" || echo "❌ components/footer.html"
        
    - name: 📦 Setup Pages
      uses: actions/configure-pages@v3
      
    - name: 📤 Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './'
        
    - name: 🚀 Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
      if: github.ref == 'refs/heads/development' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        
    # Ejemplo de deploy a diferentes proveedores
    # Descomenta y configura según tu proveedor
    
