# 📝 Variables requeridas en GitHub Secrets:
# 
# 🌐 Frontend:
# - FRONTEND_URL: URL del frontend en producción
# 
# 📧 SMTP (opcional):
# - SMTP_HOST: Servidor SMTP
# - SMTP_PORT: Puerto SMTP  
# - SMTP_USER: Usuario SMTP
# - SMTP_PASS: Contraseña SMTP
# - CONTACT_EMAIL: Email de contacto
# 
# 📨 EmailJS (requerido):
# - EMAILJS_SERVICE_ID: ID del servicio EmailJS
# - EMAILJS_TEMPLATE_ID: ID del template EmailJS
# - EMAILJS_PUBLIC_KEY: Clave pública EmailJS
#
# 🗄️ Supabase (requerido):
# - SUPABASE_URL: URL del proyecto Supabase
# - SUPABASE_ANON_KEY: Clave anónima de Supabase
#
# 🚀 Deploy (según proveedor):
# - VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# - NETLIFY_AUTH_TOKEN, NETLIFY_SITE_ID
# - AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_DEFAULT_REGION, S3_BUCKET
# - FTP_SERVER, FTP_USERNAME, FTP_PASSWORD